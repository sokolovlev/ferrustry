name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GPU and window runtime (lavapipe, X11)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 xvfb xdotool x11-apps imagemagick
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: Determinism and save check
        run: cargo run --release -p ferrustry-headless -- save-check
      - name: Client screenshot (offscreen, lavapipe)
        if: runner.os == 'Linux'
        run: cargo run --release -p ferrustry-client -- --screenshot client.png --ticks 600 --zoom 40 --center 96,61
      - name: Client window smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo run --release -p ferrustry-client -- --frames 120
      - name: UI end-to-end (real window, mouse only)
        if: runner.os == 'Linux'
        run: scripts/e2e-ui.sh target/release/ferrustry e2e
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: client-screenshots
          path: |
            client.png
            e2e/*.png
            e2e/*.log
      - name: Replay record + verify
        shell: bash
        run: |
          cargo run --release -p ferrustry-headless -- record --seed 42 --ticks 3000 --out ci.freplay
          cargo run --release -p ferrustry-headless -- replay ci.freplay
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.os }}
          path: ci.freplay
      - name: Benchmark smoke run (B1, B2, B2-comb)
        shell: bash
        run: |
          cargo run --release -p ferrustry-headless -- bench b1 --ticks 1000 --out bench-b1-${{ matrix.os }}.json
          cargo run --release -p ferrustry-headless -- bench b2 --ticks 1000 --out bench-b2-${{ matrix.os }}.json
          cargo run --release -p ferrustry-headless -- bench b2-comb --ticks 1000 --out bench-b2-comb-${{ matrix.os }}.json
      - name: Bench script (Windows PowerShell 5.1, quick)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\bench-suite.ps1 -Quick
      - name: Bench script (bash, quick)
        if: runner.os != 'Windows'
        run: scripts/bench-suite.sh --quick
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.json

  scripts-ascii:
    # Windows PowerShell 5.1 reads BOM-less .ps1 as ANSI: non-ASCII text breaks parsing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: "! LC_ALL=C grep -nP '[^\\x00-\\x7F]' scripts/*.ps1"

  cross-platform-replay:
    # Replay, записанный на Linux, должен воспроизводиться бит в бит на Windows и macOS
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: replay-ubuntu-latest
      - run: cargo run --release -p ferrustry-headless -- replay ci.freplay

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
