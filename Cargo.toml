[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sokolovlev/ferrustry"

[workspace.dependencies]
ferrustry-content = { path = "crates/ferrustry-content" }
ferrustry-sim = { path = "crates/ferrustry-sim" }
ferrustry-format = { path = "crates/ferrustry-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
zstd = "0.13"
crc32fast = "1"
memory-stats = "1"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = "line-tables-only"

[profile.bench]
inherits = "release"
